<!DOCTYPE html>
<html>
<head>
<title>pixel plutchik</title>

<style>

body{
margin:0;
background:#0a0a0a;
color:white;
font-family:monospace;
overflow:hidden;
}

body::before{
content:"";
position:absolute;
width:600px;
height:600px;
background:radial-gradient(circle, #444 0%, transparent 70%);
top:50%;
left:50%;
transform:translate(-50%,-50%);
opacity:0.2;
animation:pulse 6s infinite;
}

@keyframes pulse{
0%{transform:translate(-50%,-50%) scale(1);}
50%{transform:translate(-50%,-50%) scale(1.2);}
100%{transform:translate(-50%,-50%) scale(1);}
}

#menu{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
}

h1{
font-size:48px;
letter-spacing:4px;
text-shadow:
0 0 10px #fff,
0 0 20px #aaa,
0 0 30px #888;
animation:flicker 3s infinite alternate;
}

@keyframes flicker{
0%{opacity:1;}
100%{opacity:0.8;}
}

p{
color:#aaa;
margin-bottom:30px;
}

button{
background:none;
color:white;
border:2px solid #666;
padding:12px 28px;
font-size:16px;
cursor:pointer;
transition:0.3s;
}

button:hover{
border-color:#fff;
box-shadow:0 0 10px #fff;
transform:scale(1.05);
}

canvas{
display:none;
margin:auto;
background:#1a1a1a;
border:4px solid #333;
image-rendering:pixelated;
}

</style>
</head>

<body>

<div id="menu">
<h1>pixel plutchik (name ts game bruh)</h1>
<p>subtitle</p>
<button onclick="startGame()">start game</button>
</div>

<canvas id="game" width="640" height="640"></canvas>

<script src="game.js"></script>

</body>
</html>
