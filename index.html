<!DOCTYPE html>
<html>
<head>
<title>pixel plutchik</title>

<style>

body{
margin:0;
background:#0b0b0f;
color:#eaeaea;
font-family:monospace;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
height:100vh;
}

/* subtle background gradient */
body::before{
content:"";
position:absolute;
width:100%;
height:100%;
background:radial-gradient(circle at center, #1a1a22 0%, #0b0b0f 70%);
opacity:0.8;
}

/* menu container */
#menu{
position:relative;
text-align:center;
z-index:2;
}

/* title */
h1{
font-size:56px;
letter-spacing:6px;
font-weight:normal;
margin-bottom:10px;
color:#f5f5f5;
}

/* subtitle */
p{
color:#777;
font-size:14px;
margin-bottom:40px;
}

/* button (clean, celeste style) */
button{
background:none;
border:none;
color:#aaa;
font-size:16px;
cursor:pointer;
transition:0.3s;
}

button:hover{
color:#fff;
letter-spacing:2px;
}

/* tiny underline effect */
button::after{
content:"";
display:block;
width:0%;
height:1px;
background:#fff;
margin:auto;
transition:0.3s;
}

button:hover::after{
width:100%;
}

/* canvas */
canvas{
display:none;
margin:auto;
background:#1a1a1a;
border:4px solid #333;
image-rendering:pixelated;
}

/* fade animation */
.fade-out{
animation:fadeOut 1s forwards;
}

@keyframes fadeOut{
to{
opacity:0;
transform:scale(1.05);
}
}

</style>
</head>

<body>

<div id="menu">
<h1>pixel plutchik</h1>
<p>balance what you feel</p>
<button onclick="startGame()">start</button>
</div>

<canvas id="game" width="640" height="640"></canvas>

<script src="levels/game.js"></script>

<script>

/* smoother start transition */
function startGame(){

const menu = document.getElementById("menu")
const canvas = document.getElementById("game")

menu.classList.add("fade-out")

setTimeout(()=>{
menu.style.display="none"
canvas.style.display="block"
window.startGame() // call your game.js start
},1000)

}

/* optional: press any key */
document.addEventListener("keydown", ()=>{
startGame()
})

</script>

</body>
</html>
