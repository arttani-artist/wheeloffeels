<!DOCTYPE html>
<html>
<head>

<title>pixel plutchik</title>

<style>

body{
background:#0e0e0e;
color:white;
font-family:monospace;
text-align:center;
margin:0;
}

#menu{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
}

button{
background:#222;
color:white;
border:2px solid #555;
padding:15px 25px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#444;
}

canvas{
background:#1a1a1a;
display:none;
margin:auto;
border:4px solid #333;
image-rendering:pixelated;
}

</style>

</head>

<body>

<div id="menu">

<h1>pixel plutchik</h1>
<p>a game about emotions</p>

<button onclick="startGame()">start game</button>

</div>

<canvas id="game" width="640" height="640"></canvas>

<script src="game.js"></script>

</body>
</html>
